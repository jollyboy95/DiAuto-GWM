name: Build GWM H7 arm64 debug APK

# arm64-v8a debug build of the GWM/Haval H7 port (github flavour).
# Every run publishes its test, lint and build reports, and on success the APK, to the
# `gwm-h7-builds` branch, so results can be read without downloading raw logs.
# Signing: the repository secret GWM_DEV_KEYSTORE_B64 (a base64 PKCS12 development key) keeps
# one signature across builds. Without it the runner's throwaway debug key is used and a warning
# is raised. No key material is ever committed.
on:
  push:
    branches: [main, 'gwm-h7-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gwm-h7-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  APK_NAME: DiAuto-GWM-H7-arm64-debug.apk
  BUILDS_BRANCH: gwm-h7-builds

jobs:
  apk:
    if: github.ref != 'refs/heads/gwm-h7-builds'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Revision number
        run: echo "Building GWM H7 revision r${{ github.run_number }} from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install pinned SDK, NDK and CMake
        run: |
          for attempt in 1 2 3; do
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1" && exit 0
            echo "sdkmanager attempt $attempt failed; retrying in 15s" >&2; sleep 15
          done
          exit 1

      - uses: gradle/actions/setup-gradle@v4

      - name: Development signing key
        env:
          KEY_B64: ${{ secrets.GWM_DEV_KEYSTORE_B64 }}
        run: |
          if [ -n "${KEY_B64:-}" ]; then
            printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/gwm-dev.p12"
            echo "GWM_DEV_KEYSTORE=$RUNNER_TEMP/gwm-dev.p12" >> "$GITHUB_ENV"
            echo "SIGNING=consistent development key" >> "$GITHUB_ENV"
          else
            echo "::warning title=Signing::GWM_DEV_KEYSTORE_B64 is not set; this APK uses a throwaway key and will not update an earlier build in place."
            echo "SIGNING=throwaway runner debug key" >> "$GITHUB_ENV"
          fi

      - name: Prepare step runner
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          cat > "$RUNNER_TEMP/gradle-step.sh" <<'EOF'
          #!/usr/bin/env bash
          # gradle-step.sh <label> <gradle args...>: runs Gradle, keeps the log, and on failure
          # writes the compiler/aapt/Gradle error lines to reports/<label>-errors.txt.
          set -uo pipefail
          label="$1"; shift
          log="$RUNNER_TEMP/$label.log"
          ./gradlew "$@" --stacktrace 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E 'ERROR:|error:|^e: |^w: .*GWM|AAPT: error|What went wrong|^> |Manifest merger failed|FAILED|Exception' "$log" \
              | grep -v '^> Task' | awk '!seen[$0]++' | head -120 | cut -c1-400 > "$RUNNER_TEMP/reports/$label-errors.txt"
            [ -s "$RUNNER_TEMP/reports/$label-errors.txt" ] || tail -80 "$log" | cut -c1-400 > "$RUNNER_TEMP/reports/$label-errors.txt"
            msg=$(head -40 "$RUNNER_TEMP/reports/$label-errors.txt" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=$label failed::$msg"
          fi
          echo "$label: exit $status" >> "$RUNNER_TEMP/reports/steps.txt"
          exit "$status"
          EOF
          chmod +x "$RUNNER_TEMP/gradle-step.sh"

      - name: Translations check
        id: l10n
        continue-on-error: true
        run: python3 scripts/check_localization.py 2>&1 | tee "$RUNNER_TEMP/reports/localization.txt"; exit ${PIPESTATUS[0]}

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: $RUNNER_TEMP/gradle-step.sh unit-tests :app:testGithubDebugUnitTest -PgwmAbiFilters=arm64-v8a

      - name: Lint
        id: lint
        continue-on-error: true
        run: $RUNNER_TEMP/gradle-step.sh lint :app:lintGithubDebug -PgwmAbiFilters=arm64-v8a

      - name: Assemble arm64-v8a debug APK
        id: assemble
        run: $RUNNER_TEMP/gradle-step.sh assemble :app:assembleGithubDebug -PgwmAbiFilters=arm64-v8a -PgwmRevision=${{ github.run_number }}

      - name: Verify the APK
        id: apk
        run: |
          set -euo pipefail
          built=$(ls app/build/outputs/apk/github/debug/*.apk | head -1)
          test -s "$built"
          cp "$built" "$APK_NAME"
          abis=$(unzip -l "$APK_NAME" | grep -o 'lib/[a-zA-Z0-9_-]*/' | sort -u | sed 's#lib/##; s#/$##' | tr '\n' ' ')
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/aapt2" dump badging "$APK_NAME" | grep -E "^package:|sdkVersion|targetSdkVersion|native-code|application-label:" > "$RUNNER_TEMP/reports/badging.txt"
          "$bt/apksigner" verify --print-certs "$APK_NAME" > "$RUNNER_TEMP/reports/signature.txt"
          sha=$(sha256sum "$APK_NAME" | cut -d' ' -f1)
          echo "$sha  $APK_NAME" > "$APK_NAME.sha256"
          {
            echo "revision: r${{ github.run_number }}"
            echo "source: ${GITHUB_SHA} (${GITHUB_REF_NAME})"
            echo "apk: $APK_NAME ($(stat -c %s "$APK_NAME") bytes)"
            echo "sha256: $sha"
            echo "abis: $abis"
            echo "signing: $SIGNING"
          } > "$RUNNER_TEMP/reports/apk.txt"
          cat "$RUNNER_TEMP/reports/apk.txt" "$RUNNER_TEMP/reports/badging.txt" "$RUNNER_TEMP/reports/signature.txt"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "::notice title=APK r${{ github.run_number }}::sha256 $sha, ABIs $abis, $SIGNING"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiAuto-GWM-H7-arm64-debug-r${{ github.run_number }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          if-no-files-found: error

      - name: Summarise tests and lint
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/reports" <<'EOF'
          import glob, os, sys, xml.etree.ElementTree as ET
          out = sys.argv[1]
          tests = fails = errors = skipped = 0; failed = []
          for f in glob.glob('app/build/test-results/testGithubDebugUnitTest/*.xml'):
              r = ET.parse(f).getroot()
              tests += int(r.get('tests', 0)); fails += int(r.get('failures', 0))
              errors += int(r.get('errors', 0)); skipped += int(r.get('skipped', 0))
              for case in r.iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      failed.append(f"{case.get('classname')}.{case.get('name')}: {(bad.get('message') or '')[:300]}")
          with open(os.path.join(out, 'tests.txt'), 'w') as fh:
              fh.write(f"tests={tests} failures={fails} errors={errors} skipped={skipped}\n")
              fh.write('\n'.join(failed) + '\n')
          lint = glob.glob('app/build/reports/lint-results-githubDebug.xml')
          rows = []
          if lint:
              for issue in ET.parse(lint[0]).getroot().iter('issue'):
                  loc = issue.find('location')
                  path = loc.get('file', '') if loc is not None else ''
                  rows.append((issue.get('severity'), issue.get('id'), path.split('/app/')[-1],
                               loc.get('line', '') if loc is not None else '', (issue.get('message') or '')[:200]))
          with open(os.path.join(out, 'lint.txt'), 'w') as fh:
              from collections import Counter
              fh.write('lint issues by severity: ' + str(dict(Counter(r[0] for r in rows))) + '\n')
              # Errors anywhere, and every issue in GWM code, in full.
              for r in rows:
                  if r[0] in ('Error', 'Fatal') or 'gwm' in r[2].lower():
                      fh.write(' | '.join(r) + '\n')
          EOF
          cat "$RUNNER_TEMP/reports/tests.txt" "$RUNNER_TEMP/reports/lint.txt" | head -80

      - name: Publish reports and APK to the builds branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          stash="$RUNNER_TEMP/publish"; mkdir -p "$stash/reports"
          cp "$RUNNER_TEMP"/reports/* "$stash/reports/" 2>/dev/null || true
          ok=false
          if [ -s "$APK_NAME" ] && [ "${{ steps.apk.outcome }}" = "success" ]; then
            cp "$APK_NAME" "$APK_NAME.sha256" "$stash/"; ok=true
          fi
          rev="r${{ github.run_number }}"
          for i in 1 2 3; do
            if git ls-remote --exit-code --heads origin "$BUILDS_BRANCH" >/dev/null; then
              git fetch --depth=1 origin "$BUILDS_BRANCH"
              git checkout -f -B publish FETCH_HEAD
            else
              git checkout -f --orphan publish
              git rm -rf --quiet . || true
              printf '%s\n' "# DiAuto GWM H7 builds" "" \
                "Build output only. Source lives on the gwm-h7-* branches." "" \
                "| Revision | Built (UTC) | Branch | Source | Result | APK SHA-256 |" \
                "| --- | --- | --- | --- | --- | --- |" > REVISIONS.md
            fi
            rm -rf reports; mkdir -p reports; cp "$stash"/reports/* reports/ 2>/dev/null || true
            result=failed
            if $ok; then cp "$stash/$APK_NAME" "$stash/$APK_NAME.sha256" .; result=ok; fi
            sha=$($ok && cut -d' ' -f1 "$APK_NAME.sha256" || echo "-")
            printf '| %s | %s | %s | %s | %s | `%s` |\n' "$rev" "$(date -u '+%Y-%m-%d %H:%M')" "$GITHUB_REF_NAME" \
              "${GITHUB_SHA::7}" "$result" "$sha" >> REVISIONS.md
            git add -A
            git commit -q -m "GWM H7 $rev: $result (${GITHUB_SHA::7}) [skip ci]"
            git push origin "publish:$BUILDS_BRANCH" && exit 0
            sleep 5
          done
          exit 1

      - name: Fail if tests or lint failed
        if: steps.tests.outcome != 'success' || steps.lint.outcome != 'success' || steps.l10n.outcome != 'success'
        run: |
          echo "::error::tests=${{ steps.tests.outcome }} lint=${{ steps.lint.outcome }} translations=${{ steps.l10n.outcome }}"
          exit 1
